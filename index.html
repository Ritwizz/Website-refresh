<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#131313"/><text x="50" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">RS</text></svg></template>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Ritwiz Sharma — Industrial Designer, Guwahati</title>
<meta name="description" content="Ritwiz Sharma is an industrial designer in Guwahati working across consumer products, robotics and retail environments — from first blockout to a manufacturing package.">
<meta property="og:title" content="Ritwiz Sharma — Industrial Designer">
<meta property="og:description" content="Consumer products, robotics and retail environments. Guwahati, Assam, India.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="crossorigin">
<link rel="preload" as="font" type="font/woff2" href="https://cdn.jsdelivr.net/gh/RandomMaerks/Overused-Grotesk@main/fonts/variable/OverusedGrotesk-VF.woff2" crossorigin="crossorigin">
<style>
@font-face{font-family:'Overused Grotesk';src:url('https://cdn.jsdelivr.net/gh/RandomMaerks/Overused-Grotesk@main/fonts/variable/OverusedGrotesk-VF.woff2') format('woff2-variations'),url('https://cdn.jsdelivr.net/gh/RandomMaerks/Overused-Grotesk@main/fonts/variable/OverusedGrotesk-VF.ttf') format('truetype-variations');font-weight:300 900;font-display:swap;}
html{background:#0B0B0B}
body{margin:0;padding:0;background:#0B0B0B;}
a{color:#F4F2EE;text-decoration:none}
a:hover{color:#F4F2EE}
:focus-visible{outline:1.5px solid #F4F2EE;outline-offset:3px}
@keyframes v8up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.v8up{animation:v8up 660ms cubic-bezier(.22,.7,.24,1) both}
@media (prefers-reduced-motion:reduce){.v8up{animation:none}}
.v8nav a,.v8pg{transition:opacity 140ms ease-out,color 140ms ease-out}
.v8nav a:hover{opacity:.62}
.v8pg:hover{opacity:1 !important}
.v8ar{transition:opacity 130ms ease-out,transform 180ms cubic-bezier(.2,.8,.24,1)}
.v8pg:hover .v8ar{opacity:1;transform:translate(2px,-2px)}
@media (max-width:1420px){.v8pgsec{display:none !important}}
@media (max-width:1100px){.v8pager{grid-template-columns:repeat(6,minmax(0,1fr)) !important}}
@media (max-width:900px){.v8navmid{display:none !important}.v8pager{grid-template-columns:repeat(3,minmax(0,1fr)) !important}.v8hero{min-height:88vh !important}}
@media print{h1,h2,h3,blockquote,[data-screen-label="Note"]{break-after:avoid}figure,figcaption,[data-screen-label^="Images"]{break-inside:avoid}}
</style>
</helmet>

<div style="background:#0B0B0B;padding:clamp(0px,1.4vh,16px);box-sizing:border-box;">
<section class="v8hero" data-screen-label="Hero" style="position:relative;min-height:calc(100vh - clamp(0px,2.8vh,32px));background:#0B0B0B;overflow:hidden;font-family:'Overused Grotesk',Helvetica,Arial,sans-serif;color:#F4F2EE;">
  <img ref="{{ imgA }}" alt="" decoding="sync" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity 260ms ease-out;" />
  <img ref="{{ imgB }}" alt="" decoding="sync" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 260ms ease-out;" />
  <div ref="{{ holdRef }}" style="position:absolute;inset:0;background:#131313;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 260ms ease-out;">
    <span style="font-size:11.5px;font-weight:500;letter-spacing:-.004em;opacity:.3;">Teaser pending</span>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,11,.58) 0%,rgba(11,11,11,.08) 30%,rgba(11,11,11,.32) 62%,rgba(11,11,11,.84) 100%);"></div>

  <div style="position:relative;min-height:calc(100vh - clamp(0px,2.8vh,32px));display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;padding:clamp(18px,2.4vw,30px) clamp(18px,2.8vw,40px);">

    <header class="v8nav v8up" style="display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:20px;font-size:12.5px;font-weight:500;letter-spacing:-.005em;">
      <a href="index.html" style="font-weight:600;">Ritwiz Sharma — Industrial Designer</a>
      <span class="v8navmid" style="display:flex;gap:clamp(14px,1.6vw,24px);">
        <a href="index.html" style="font-weight:600;">Index</a>
        <a href="shenanigans.html" style="opacity:.62;">Shenanigans</a>
        <a href="about.html" style="opacity:.62;">About</a>
      </span>
      <span style="justify-self:end;display:flex;gap:clamp(12px,1.4vw,20px);">
        <span style="opacity:.62;">Guwahati, IN</span>
        <a href="mailto:ritwizsharma1@gmail.com?subject=Ritwiz%2C%20work%20with%20me!">Contact</a>
      </span>
    </header>

    <div style="display:flex;flex-direction:column;gap:clamp(16px,2.4vh,26px);">
      <a ref="{{ caseRef }}" class="v8up" href="{{ heroHref }}" style="display:flex;flex-direction:column;gap:clamp(10px,1.4vh,16px);max-width:900px;animation-delay:90ms;">
        <span ref="{{ metaRef }}" style="font-size:12.5px;font-weight:500;letter-spacing:-.005em;opacity:.7;font-variant-numeric:tabular-nums;"></span>
        <h1 ref="{{ titleRef }}" style="margin:0;font-weight:600;font-size:clamp(34px,5.2vw,76px);line-height:.98;letter-spacing:-.036em;text-wrap:balance;"></h1>
        <p ref="{{ blurbRef }}" style="margin:0;font-size:16px;font-weight:450;line-height:1.5;letter-spacing:-.008em;opacity:.74;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;"></p>
      </a>

      <div class="v8up" style="display:flex;flex-direction:column;gap:clamp(6px,.8vh,9px);animation-delay:170ms;">
        <div class="v8pager" style="display:grid;grid-template-columns:repeat(11,minmax(0,1fr));border-top:1px solid rgba(244,242,238,.26);">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="11">
            <a class="v8pg" href="{{ r.href }}" target="{{ r.target }}" rel="{{ r.rel }}" onMouseEnter="{{ r.hover }}" onFocus="{{ r.hover }}" ref="{{ r.ref }}" style="display:flex;flex-direction:column;gap:4px;padding:clamp(10px,1.2vh,14px) clamp(8px,.9vw,14px) 0 0;opacity:.6;border-top:1px solid transparent;margin-top:-1px;">
              <span style="display:flex;align-items:center;gap:6px;min-width:0;">
                <span style="font-size:12px;font-weight:500;opacity:.62;font-variant-numeric:tabular-nums;">{{ r.year }}</span>
                <sc-if value="{{ r.nda }}" hint-placeholder-val="{{ false }}">
                  <span style="flex:none;padding:1.5px 5px;border:1px solid rgba(244,242,238,.16);border-radius:.66em;font-size:10px;font-weight:500;letter-spacing:.01em;line-height:1.35;opacity:.62;white-space:nowrap;">Confidential</span>
                </sc-if>
              </span>
              <span style="display:flex;align-items:baseline;gap:5px;min-width:0;">
                <span style="min-width:0;font-size:13px;font-weight:600;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ r.short }}</span>
                <span class="v8ar" style="font-size:11px;line-height:1;opacity:.4;">{{ r.mark }}</span>
              </span>
              <span class="v8pgsec" style="font-size:12px;font-weight:500;opacity:.62;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ r.sector }}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</section>

<section data-screen-label="Footer" style="background:#0B0B0B;color:#F4F2EE;font-family:'Overused Grotesk',Helvetica,Arial,sans-serif;padding:clamp(20px,3vh,34px) clamp(18px,2.8vw,40px);">
  <div style="max-width:1560px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:500;letter-spacing:-.005em;opacity:.55;font-variant-numeric:tabular-nums;">
    <span>Ritwiz Sharma — Industrial Designer</span>
    <span>Guwahati, IN</span>
  </div>
</section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const ITEMS = [
  {t:"Snapin' Street", short:"Snapin' Street", sector:"Retail", year:"2025", href:"snapin.html", img:"snapin/final-render-1.png",
   blurb:"Street-food sampling kiosk for a spice brand. Manufactured."},
  {t:"Aakaar", short:"Aakaar", sector:"Consumer", year:"2025", href:"aakaar.html", img:"web/aakaar/full-board_fix_2.webp",
   blurb:"A chess set for modern India, in terracotta and bronze."},
  {t:"Ergoplay", short:"Ergoplay", sector:"Peripherals", year:"2024", href:"ergoplay.html", img:"ergoplay/opt/maker-set.jpg",
   blurb:"One mouse, two shapes — gaming grip to ergonomic."},
  {t:"Vita", short:"Vita", sector:"Transport", year:"2023", href:"vita.html", img:"vita/vita-scooter-concrete-side-view.jpg",
   blurb:"Grand touring, applied to a scooter for young riders."},
  {t:"Altr", short:"Altr", sector:"Furniture", year:"2023", href:"altr.html", img:"altr/altr-desks-all-together.jpg",
   blurb:"Modular office furniture for premium co-working spaces."},
  {t:"The art of concealing", short:"Concealing", sector:"Appliances", year:"2022", href:"art-of-concealing.html", img:"aoc/all-products-staged.jpg",
   blurb:"Home appliances and furniture for luxury interiors."}
];

// Under agreement: hovering one takes over the hero like any case study.
// img: drop a teaser file in nda/ and set its path here to replace the placeholder field.
const NDA = [
  {t:"Innate", short:"Innate", sector:"Robotics", year:"2026", href:"https://www.innate.bot/", img:"nda/innate-teaser.jpg", nda:true,
   blurb:"Semi humanoid robot."},
  {t:"Posha", short:"Posha", sector:"Appliances", year:"2026", href:"https://www.posha.com/", img:"nda/posha-teaser.jpg", nda:true,
   blurb:"Countertop cooking robot."},
  {t:"Sonic Lamb", short:"Sonic Lamb", sector:"Audio", year:"2026", href:"https://soniclamb.com/en-in", img:"nda/soniclamb-teaser.jpg", nda:true,
   blurb:"Headphones, through a Kickstarter campaign."},
  {t:"Tangible Robots", short:"Tangible", sector:"Robotics", year:"2025", href:"https://tangiblerobots.ai/", img:"nda/tangible-teaser.jpg", nda:true,
   blurb:"Semi humanoid home robot."},
  {t:"Brewtal", short:"Brewtal", sector:"Appliances", year:"2025", href:"https://www.getbrewtal.com/", img:"nda/brewtal-teaser.jpg", nda:true,
   blurb:"Tea brewer."}
];

// One timeline, newest (2026) left → oldest (2022) right.
const ORDER = ["Innate","Posha","Sonic Lamb","Tangible Robots","Brewtal","Snapin' Street","Aakaar",
  "Ergoplay","Vita","Altr","The art of concealing"];
const POOL = ITEMS.concat(NDA);
const ALL = ORDER.map(n => POOL.find(it => it.t === n)).filter(Boolean);

class Component extends DCLogic {
  constructor(props){
    super(props);
    this.imgA_ = React.createRef();
    this.imgB_ = React.createRef();
    this.metaRef_ = React.createRef();
    this.titleRef_ = React.createRef();
    this.blurbRef_ = React.createRef();
    this.caseRef_ = React.createRef();
    this.holdRef_ = React.createRef();
    this.pgRefs_ = ALL.map(() => React.createRef());
    this.top_ = true;
    this.cur_ = -1;
  }

  componentDidMount(){
    this.show(0);
    // warm the rest, two at a time, so pager hovers are instant
    const q = ALL.slice(1).filter(it => it.img);
    let i = 0;
    const next = () => {
      if(i >= q.length) return;
      const batch = q.slice(i, i + 2); i += 2;
      let left = batch.length;
      batch.forEach(it => {
        const im = new Image();
        im.onload = im.onerror = () => { if(--left === 0) setTimeout(next, 60); };
        im.src = it.img;
      });
    };
    setTimeout(next, 400);
  }

  paintText(it, i){
    const m = this.metaRef_.current, t = this.titleRef_.current, b = this.blurbRef_.current, c = this.caseRef_.current;
    if(m) m.textContent = it.sector + ' · ' + it.year + (it.nda ? ' · Confidential' : '');
    if(t) t.textContent = it.t;
    if(b) b.textContent = it.blurb;
    if(c){
      c.setAttribute('href', it.href);
      if(it.nda){ c.setAttribute('target','_blank'); c.setAttribute('rel','noopener noreferrer'); }
      else { c.removeAttribute('target'); c.removeAttribute('rel'); }
    }
    this.pgRefs_.forEach((r, j) => {
      const el = r.current; if(!el) return;
      el.style.opacity = j === i ? '1' : '.6';
      el.style.borderTopColor = j === i ? '#F4F2EE' : 'transparent';
    });
  }

  show(i){
    if(i === this.cur_) return;
    const it = ALL[i];
    const a = this.imgA_.current, b = this.imgB_.current, h = this.holdRef_.current;
    if(!it || !a || !b) return;
    this.cur_ = i;
    this.paintText(it, i);
    if(!it.img){ if(h) h.style.opacity = '1'; return; }   // teaser not in yet — neutral field
    if(h) h.style.opacity = '0';
    if(a.getAttribute('src') === null && b.getAttribute('src') === null){
      a.src = it.img; a.style.opacity = '1'; b.style.opacity = '0';
      return;
    }
    const incoming = this.top_ ? b : a, outgoing = this.top_ ? a : b;
    const swap = () => { incoming.style.opacity = '1'; outgoing.style.opacity = '0'; this.top_ = !this.top_; };
    if(incoming.getAttribute('src') === it.img){ swap(); return; }
    incoming.onload = swap;
    incoming.src = it.img;
  }

  renderVals(){
    return {
      imgA: this.imgA_, imgB: this.imgB_, holdRef: this.holdRef_,
      metaRef: this.metaRef_, titleRef: this.titleRef_,
      blurbRef: this.blurbRef_, caseRef: this.caseRef_, heroHref: ALL[0].href,
      rows: ALL.map((it, i) => ({
        href: it.href, short: it.short, sector: it.sector, year: it.year,
        target: it.nda ? '_blank' : undefined, rel: it.nda ? 'noopener noreferrer' : undefined,
        mark: it.nda ? '\u2197' : '', nda: !!it.nda,
        ref: this.pgRefs_[i], hover: () => this.show(i)
      }))
    };
  }
}

</script>
</body>
</html>
