<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./nav-slugs.js"></script>
<title>CMF Booth — Labs — Ritwiz Sharma</title>
<meta name="description" content="Build a CMF direction from stacked blocks — material, colour, finish, proportion — and see it under daylight, store, home, golden-hour, overcast, night and UV light.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://ritwizsharma.com/labs/booth">
<meta property="og:url" content="https://ritwizsharma.com/labs/booth">
<meta property="og:title" content="CMF Booth — Ritwiz Sharma">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
html,body{margin:0;padding:0;background:#E4E4E1;overflow:hidden}
a{color:inherit;text-decoration:none}
a:hover{color:inherit;text-decoration:underline}
:focus-visible{outline:2px solid #2E6BFF;outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:20px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:20px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:1px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{background:transparent}
@media (max-height:700px){[data-mats]{grid-template-columns:repeat(6,minmax(0,1fr)) !important;gap:4px !important}[data-mats] button{padding:8px 2px 6px !important;gap:4px !important}[data-mats] button>span:first-child{width:28px !important;height:28px !important}[data-mats] button>span:last-child{display:none}[data-pad]{height:96px !important}[data-sheet]{gap:9px !important;padding:12px 12px 12px !important}}
@media (max-width:760px){[data-ratio]{display:none !important}[data-lampname]{display:none !important}[data-sheet]{bottom:8px !important}}
</style>
</helmet>

<div style="position:fixed;inset:0;overflow:hidden;font-family:'Archivo',Helvetica,Arial,sans-serif;background:{{ bg }};color:{{ ink }};transition:background-color 600ms ease,color 600ms ease;">
  <div ref="{{ hostRef }}" style="position:absolute;inset:0;"></div>

  <div style="position:absolute;inset:0;pointer-events:none;">
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="0">
      <button ref="{{ d.ref }}" onClick="{{ d.onClick }}" aria-label="{{ d.label }}" title="{{ d.label }}" style="position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;border:0;padding:0;border-radius:50%;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.34);box-shadow:0 0 0 1px rgba(255,255,255,.55) inset;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:{{ d.op }};transition:opacity 200ms;">
        <span style="width:12px;height:12px;border-radius:50%;box-sizing:border-box;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);background:{{ d.fill }};"></span>
      </button>
    </sc-for>
  </div>

  <header style="position:absolute;top:18px;left:20px;display:flex;align-items:baseline;gap:14px;">
    <a href="/labs" style="font-family:'IBM Plex Mono',monospace;font-size:12px;">← Labs</a>
    <span style="font-size:16px;font-weight:750;letter-spacing:-.01em;">CMF Booth</span>
  </header>

  <div style="position:absolute;top:14px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;">
    <nav aria-label="Lighting" style="display:flex;gap:2px;padding:4px;border-radius:999px;background:{{ pillBg }};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 20px rgba(0,0,0,.08);">
      <button onPointerDown="{{ L0.down }}" onClick="{{ L0.click }}" title="{{ L0.title }}" aria-pressed="{{ L0.on }}" style="width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;background:{{ L0.bg }};color:{{ L0.fg }};transition:background 160ms,color 160ms;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"></path></svg>
      </button>
      <button onPointerDown="{{ L1.down }}" onClick="{{ L1.click }}" title="{{ L1.title }}" aria-pressed="{{ L1.on }}" style="width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;background:{{ L1.bg }};color:{{ L1.fg }};transition:background 160ms,color 160ms;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;"><rect x="3" y="7.5" width="18" height="5" rx="2.5"></rect><path d="M7 15.5v2.5M12 15.5v3.5M17 15.5v2.5"></path></svg>
      </button>
      <button onPointerDown="{{ L2.down }}" onClick="{{ L2.click }}" title="{{ L2.title }}" aria-pressed="{{ L2.on }}" style="width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;background:{{ L2.bg }};color:{{ L2.fg }};transition:background 160ms,color 160ms;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;"><path d="M9.2 17.5h5.6M10.2 20.5h3.6M12 3.5a6 6 0 0 0-3.6 10.8c.5.4.8 1 .8 1.7v.5h5.6v-.5c0-.7.3-1.3.8-1.7A6 6 0 0 0 12 3.5z"></path></svg>
      </button>
      <button onPointerDown="{{ L3.down }}" onClick="{{ L3.click }}" title="{{ L3.title }}" aria-pressed="{{ L3.on }}" style="width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;background:{{ L3.bg }};color:{{ L3.fg }};transition:background 160ms,color 160ms;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;"><path d="M3 17h18M7 17a5 5 0 0 1 10 0M12 5.5v2.2M5.6 10.2l1.5 1.5M18.4 10.2l-1.5 1.5M7 20.5h10"></path></svg>
      </button>
      <button onPointerDown="{{ L4.down }}" onClick="{{ L4.click }}" title="{{ L4.title }}" aria-pressed="{{ L4.on }}" style="width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;background:{{ L4.bg }};color:{{ L4.fg }};transition:background 160ms,color 160ms;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;"><path d="M7.5 18.5h9.5a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.9 9.7a4.4 4.4 0 0 0 .6 8.8z"></path></svg>
      </button>
      <button onPointerDown="{{ L5.down }}" onClick="{{ L5.click }}" title="{{ L5.title }}" aria-pressed="{{ L5.on }}" style="width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;background:{{ L5.bg }};color:{{ L5.fg }};transition:background 160ms,color 160ms;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"></path></svg>
      </button>
      <button onPointerDown="{{ L6.down }}" onClick="{{ L6.click }}" title="{{ L6.title }}" aria-pressed="{{ L6.on }}" style="width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;background:{{ L6.bg }};color:{{ L6.fg }};transition:background 160ms,color 160ms;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.5;"><circle cx="12" cy="12" r="8.5" style="stroke-dasharray:2 2.4;"></circle><text x="12" y="15" fill="currentColor" stroke="none" style="font:700 8px Archivo,sans-serif;text-anchor:middle;">UV</text></svg>
      </button>
    </nav>
    <div data-lampname style="display:grid;justify-items:end;gap:2px;padding-right:8px;">
      <span style="font-size:13px;font-weight:650;">{{ lampName }}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:{{ sub }};">{{ lampSpec }}</span>
    </div>
    <div role="group" aria-label="Background" style="display:flex;gap:2px;padding:4px;border-radius:999px;background:{{ pillBg }};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 20px rgba(0,0,0,.08);">
      <sc-for list="{{ bgOpts }}" as="o" hint-placeholder-count="4">
        <button onClick="{{ o.onClick }}" title="{{ o.title }}" aria-pressed="{{ o.on }}" style="height:30px;padding:0 11px 0 7px;border:0;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:600;background:{{ o.bg }};color:{{ o.fg }};transition:background 160ms,color 160ms;">
          <span style="width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 1px rgba(128,128,128,.45) inset;background:{{ o.sw }};"></span>
          <span>{{ o.label }}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{ isGrad }}" hint-placeholder-val="{{ false }}">
      <div aria-label="Gradient" style="width:248px;box-sizing:border-box;padding:12px;border-radius:16px;display:grid;gap:10px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.12);color:#161616;">
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;">
          <sc-for list="{{ gradPresets }}" as="g" hint-placeholder-count="3">
            <button onClick="{{ g.onClick }}" title="{{ g.name }}" style="display:grid;gap:5px;justify-items:center;padding:0;border:0;background:transparent;cursor:pointer;font-family:'Archivo',sans-serif;font-size:11.5px;font-weight:600;color:#161616;">
              <span style="width:100%;height:34px;border-radius:10px;background:{{ g.css }};box-shadow:{{ g.ring }};"></span>
              <span>{{ g.name }}</span>
            </button>
          </sc-for>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;">
          <label style="display:grid;gap:4px;font-size:11.5px;font-weight:600;color:rgba(22,22,22,.66);">
            <span>{{ gradALabel }}</span>
            <span style="display:flex;align-items:center;gap:6px;padding:3px;border-radius:10px;background:rgba(0,0,0,.05);">
              <input type="color" value="{{ gradA }}" onChange="{{ onGradA }}" style="width:26px;height:26px;padding:0;border:0;border-radius:7px;background:transparent;cursor:pointer;">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#161616;">{{ gradA }}</span>
            </span>
          </label>
          <label style="display:grid;gap:4px;font-size:11.5px;font-weight:600;color:rgba(22,22,22,.66);">
            <span>{{ gradBLabel }}</span>
            <span style="display:flex;align-items:center;gap:6px;padding:3px;border-radius:10px;background:rgba(0,0,0,.05);">
              <input type="color" value="{{ gradB }}" onChange="{{ onGradB }}" style="width:26px;height:26px;padding:0;border:0;border-radius:7px;background:transparent;cursor:pointer;">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#161616;">{{ gradB }}</span>
            </span>
          </label>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:3px;border-radius:11px;background:rgba(0,0,0,.05);">
          <sc-for list="{{ gradTypes }}" as="t" hint-placeholder-count="2">
            <button onClick="{{ t.onClick }}" style="padding:7px 6px;border:0;border-radius:8px;cursor:pointer;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:600;color:#161616;background:{{ t.bg }};box-shadow:{{ t.sh }};">{{ t.label }}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ hasSplit }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:260px;text-align:right;font-size:12.5px;line-height:1.35;padding:7px 11px;border-radius:12px;background:{{ pillBg }};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-wrap:pretty;">
        <span style="font-weight:650;">{{ splitA }}</span>
        <span style="display:block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:{{ sub }};">{{ splitB }}</span>
      </div>
    </sc-if>
  </div>

  <div data-ratio style="position:absolute;left:20px;bottom:20px;display:grid;gap:8px;width:250px;opacity:{{ ratioOp }};pointer-events:none;transition:opacity 160ms;">
    <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;">
      <sc-for list="{{ ratio }}" as="r" hint-placeholder-count="1">
        <span style="height:100%;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.1) inset;width:{{ r.w }};background:{{ r.bg }};transition:width 300ms ease,background-color 600ms ease;"></span>
      </sc-for>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:{{ sub }};">
      <sc-for list="{{ roles }}" as="r" hint-placeholder-count="1">
        <span>{{ r.t }}</span>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ noSel }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;">
      <sc-if value="{{ showHint }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:13px;color:{{ sub }};white-space:nowrap;">Click a block to style it · drag to rotate</span>
      </sc-if>
      <sc-if value="{{ adding }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:4px;padding:6px;border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.12);color:#161616;">
          <sc-for list="{{ sizes }}" as="z" hint-placeholder-count="5">
            <button onClick="{{ z.onAdd }}" title="{{ z.title }}" style="display:grid;justify-items:center;gap:6px;padding:10px 10px 8px;min-width:58px;border:0;border-radius:12px;background:transparent;cursor:pointer;color:#161616;font-family:'Archivo',sans-serif;" style-hover="background:rgba(0,0,0,.06);">
              <span style="display:grid;gap:3px;grid-template-columns:{{ z.cols }};height:21px;align-content:center;">
                <sc-for list="{{ z.dots }}" as="k" hint-placeholder-count="2">
                  <span style="width:6px;height:6px;border-radius:50%;background:#161616;"></span>
                </sc-for>
              </span>
              <span style="font-size:12.5px;font-weight:600;">{{ z.label }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <div style="display:flex;align-items:center;gap:6px;">
        <button onClick="{{ undo }}" disabled="{{ undoOff }}" title="Undo (Ctrl+Z)" aria-label="Undo" style="width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:{{ pillBg }};color:{{ ink }};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:{{ undoOp }};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
        </button>
        <button onClick="{{ toggleAdd }}" disabled="{{ addOff }}" style="height:44px;padding:0 20px 0 16px;border:0;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-size:14px;font-weight:650;background:{{ addBg }};color:{{ addFg }};box-shadow:0 8px 24px rgba(0,0,0,.14);opacity:{{ addOp }};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2.2;stroke-linecap:round;"><path d="M12 5v14M5 12h14"></path></svg>
          <span>{{ addLabel }}</span>
        </button>
        <button onClick="{{ shuffle }}" title="Shuffle every block" aria-label="Shuffle" style="width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:{{ pillBg }};color:{{ ink }};backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <section data-sheet aria-label="Edit block" style="position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(440px,calc(100% - 16px));box-sizing:border-box;padding:14px 14px 16px;border-radius:24px;background:rgba(255,255,255,.86);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:0 18px 50px rgba(0,0,0,.16),0 0 0 1px rgba(255,255,255,.6) inset;color:#161616;display:grid;gap:12px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="width:22px;height:22px;flex:none;border-radius:7px;background:{{ sb.sw }};box-shadow:0 0 0 1px rgba(0,0,0,.12) inset;"></span>
        <div style="display:grid;gap:1px;margin-right:auto;min-width:0;">
          <span style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ sb.name }}</span>
          <span style="font-size:12.5px;color:rgba(22,22,22,.66);white-space:nowrap;">{{ sb.role }} · {{ sb.pct }}</span>
        </div>
        <div style="display:flex;padding:3px;border-radius:10px;background:rgba(0,0,0,.05);">
          <sc-for list="{{ sb.sizes }}" as="z" hint-placeholder-count="5">
            <button onClick="{{ z.onClick }}" title="{{ z.title }}" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:5px 6px;border:0;border-radius:7px;cursor:pointer;background:{{ z.bg }};color:#161616;box-shadow:{{ z.sh }};">{{ z.label }}</button>
          </sc-for>
        </div>
        <button onClick="{{ sb.onDelete }}" disabled="{{ sb.delOff }}" title="Remove block (Delete)" aria-label="Remove block" style="width:32px;height:32px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:transparent;color:#161616;opacity:{{ sb.delOp }};" style-hover="background:rgba(0,0,0,.06);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"></path></svg>
        </button>
        <button onClick="{{ closeSheet }}" title="Done (Esc)" aria-label="Done" style="width:32px;height:32px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:rgba(0,0,0,.06);color:#161616;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width:2.2;stroke-linecap:round;"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;border-radius:14px;background:rgba(0,0,0,.05);">
        <sc-for list="{{ sb.tabs }}" as="t" hint-placeholder-count="3">
          <button onClick="{{ t.onClick }}" style="display:grid;gap:1px;text-align:left;padding:7px 10px;border:0;border-radius:11px;cursor:pointer;font-family:'Archivo',sans-serif;background:{{ t.bg }};color:#161616;box-shadow:{{ t.sh }};">
            <span style="font-size:11.5px;color:rgba(22,22,22,.66);">{{ t.n }} {{ t.label }}</span>
            <span style="font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ t.val }}</span>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{ sb.isMat }}" hint-placeholder-val="{{ true }}">
        <div data-mats style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;">
          <sc-for list="{{ sb.mats }}" as="m" hint-placeholder-count="6">
            <button onClick="{{ m.onClick }}" style="display:grid;justify-items:center;gap:6px;padding:12px 6px 10px;border:0;border-radius:14px;cursor:pointer;font-family:'Archivo',sans-serif;color:#161616;background:{{ m.bg }};box-shadow:{{ m.sh }};" style-hover="background:rgba(0,0,0,.05);">
              <span style="width:40px;height:40px;border-radius:50%;background:{{ m.ball }};box-shadow:0 3px 8px rgba(0,0,0,.18);"></span>
              <span style="font-size:13px;font-weight:650;">{{ m.label }}</span>
              <span style="font-size:11.5px;color:rgba(22,22,22,.66);">{{ m.hint }}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ sb.isCol }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;gap:12px;">
          <div data-pad ref="{{ padRef }}" onPointerDown="{{ sb.padDown }}" style="position:relative;height:132px;border-radius:16px;cursor:crosshair;touch-action:none;overflow:hidden;background:{{ sb.pad }};">

        sizes:SIZES.map(z=>({label:z.label,title:z.label+' block',bg:b.size===z.id?on:'transparent',sh:b.size===z.id?onSh:'none',onClick:()=>this.setB(b.id,{size:z.id})})),
        onDelete:()=>this.removeSel(),delOff:B.length<=1,delOp:B.length<=1?.35:1,
        tabs:[tab('mat','1','Material',m.label),tab('col','2','Colour',b.name),tab('fin','3','Finish',finVal)],
        isMat:s.step==='mat',isCol:s.step==='col',isFin:s.step==='fin',
        mats:MATS.map(x=>({label:x.label,hint:x.hint,ball:x.ball,bg:b.mat===x.id?on:'transparent',sh:b.mat===x.id?'0 0 0 2px #161616':'none',
          onClick:()=>{const p={mat:x.id};if(b.mat!==x.id){p.gloss=x.gloss;p.tex=x.id==='metal'?'fine':x.id==='plastic'?'fine':'smooth';if(oC>x.cmax){p.hex=okHex(oL,x.cmax,oH)}}this.setB(b.id,p);this.setState({step:'col'})}})),
        pad:'linear-gradient(180deg,rgba(255,255,255,.9) 0,rgba(255,255,255,0) 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.82) 100%),linear-gradient(90deg,'+hueStops+')',
        px:(oH/360*100).toFixed(2)+'%',py:(clamp((.95-oL)/.8,0,1)*100).toFixed(2)+'%',hexCss:b.hex,
        padDown:e=>{e.preventDefault();pickPad(e);const mv=ev=>pickPad(ev),up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)},
        viv:viv.toFixed(2),onViv:e=>this.setB(b.id,{hex:okHex(oL,+e.target.value*m.cmax,oH)}),
        vivG:'linear-gradient(90deg,'+css(okToLin(oL,0,oH))+','+css(okToLin(oL,m.cmax,oH))+')',
        sws:m.sw.map(([hx,nm])=>({name:nm,bg:hx,ring:b.hex.toUpperCase()===hx.toUpperCase()?'0 0 0 2px #fff,0 0 0 4px #161616':'0 0 0 1px rgba(0,0,0,.12) inset',onClick:()=>this.setB(b.id,{hex:hx,name:nm})})),
        limit:b.mat==='metal'?'Anodising can’t reach very vivid colours — the slider stops there.':b.mat==='fabric'?'Dyed yarns stay softer than moulded plastic.':'Drag the field, or pick a stock colour.',
        hex:s.hexDraft??b.hex,onHex:e=>{const v=e.target.value.trim();this.setState({hexDraft:v});const mm=/^#?([0-9a-f]{6})$/i.exec(v);if(mm)this.setB(b.id,{hex:'#'+mm[1].toUpperCase()})},onHexBlur:()=>this.setState({hexDraft:null}),
        hasGloss:b.mat!=='fabric',gloss:GLOSS.map(([gu,label,ball],i)=>({label,gu:gu+' GU',ball,bg:i===gi?on:'transparent',sh:i===gi?'0 0 0 2px #161616':'none',onClick:()=>this.setB(b.id,{gloss:gu})})),
        hasTex:!!m.tex,texs:(m.tex||[]).map((label,i)=>({label,bg:i===texIdx?on:'transparent',sh:i===texIdx?onSh:'none',onClick:()=>this.setB(b.id,{tex:['smooth','fine','coarse'][i]})})),
        noFinish:b.mat==='fabric'||b.mat==='frosted'||b.mat==='ceramic',finNote:b.mat==='fabric'?'Knit texture is built in.':b.mat==='frosted'?'Frost level follows gloss — higher reads clearer.':'Glaze is always smooth.',
        onFl:()=>this.setB(b.id,{fl:!b.fl}),flTrack:b.fl?'#161616':'rgba(0,0,0,.18)',flKnob:b.fl?'16px':'2px'}}
    else out.sb={};
    return out}
}
