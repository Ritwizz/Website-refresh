<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.mainRef = React.createRef();
    this.titleRef = React.createRef();
    this.loaderRef = React.createRef();
    this.barRef = React.createRef();
    this.pctRef = React.createRef();
  }
  componentDidMount(){
    this._preload();
    try{ this._mount(); }catch(e){ console.log('MOUNT-ERR', e && e.message, e && e.stack); }
    try{ this._eyes(); }catch(e){ console.log('EYES-ERR', e && e.message); }
  }
  _preload(){
    const loader = this.loaderRef.current;
    const bar = this.barRef.current;
    const pct = this.pctRef.current;
    const imgs = [...this.mainRef.current.querySelectorAll('img')];
    const total = imgs.length || 1;
    let done = 0, finished = false;
    const set = () => {
      const p = Math.round(done/total*100);
      if(bar) bar.style.width = p + '%';
      if(pct) pct.textContent = 'Loading ' + p + '%';
    };
    const hide = () => {
      if(finished) return; finished = true;
      set();
      if(!loader) return;
      loader.style.opacity = '0';
      setTimeout(()=>{ loader.style.display = 'none'; }, 650);
    };
    const tick = () => { done++; set(); if(done >= total) hide(); };
    imgs.forEach(img=>{
      if(img.complete && img.naturalWidth > 0){ tick(); return; }
      img.addEventListener('load', tick, {once:true});
      img.addEventListener('error', tick, {once:true});
    });
    set();
    setTimeout(hide, 12000); // safety fallback
  }
  _mount(){
    const main = this.mainRef.current;
    main.querySelectorAll('video').forEach(v=>{ v.muted = true; const p = v.play(); if(p&&p.catch) p.catch(()=>{}); });
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const wraps = [...main.querySelectorAll('[data-stage-wrap]')].map(w=>({
      el: w,
      cards: [...w.querySelectorAll('.scCard')].map(c=>({
        el: c,
        speed: parseFloat(c.dataset.speed),
        drift: parseFloat(c.dataset.drift),
        base: (c.style.transform.match(/rotate\(([-\d.]+)deg\)/)||[0,0])[1]*1
      }))
    }));
    const outro = main.querySelector('[data-outro]');
    const wrap = main.parentElement;
    wrap.style.transition = 'background .7s ease';
    const title = this.titleRef.current;
    const inner = title.querySelector('[data-inner]');
    const cta = title.querySelector('[data-cta]');
    const pill = title.querySelector('[data-pill]');
    const nameEl = title.querySelector('[data-name]');
    const descEl = title.querySelector('[data-desc]');
    title.addEventListener('click', ()=>{ if(title.dataset.cta==='1') window.open('https://www.instagram.com/ritwiz.sharma/','_blank','noopener'); });
    const projects = [
      {n:'01', name:'Full Metal',    desc:'Bedside tables made entirely from sheet-metal construction.', color:'var(--red)',   rot:-7},
      {n:'02', name:'XOOX', desc:'A children\'s drone designed for the leManoosh competition — Finalist.',                              color:'var(--blue)',  rot:6},
      {n:'03', name:'Snapin’ Select FSU', desc:'A retail installation showcasing Snapin’s newest premium collection of salts and spices.',                              color:'var(--green)', rot:-5},
      {n:'04', name:'Nothing Phone 3a — Community Edition', desc:'A dream of robot insects — a colorway raising awareness of the dwindling insect population worldwide.', color:'var(--orange)', rot:6},
      {n:'05', name:'Praan HIVE Hub', desc:'A concept remote hub for Praan air purifiers, contrasting indoor and outdoor air quality alongside other essentials.', color:'var(--purple)', rot:-6},
      {n:'06', name:'Artime', desc:'A concept line of clocks made with additive manufacturing and Tyvek.', color:'var(--teal)', rot:5}
    ];
    let active = -1, swapT = null;
    const setContent = i => {
      pill.textContent = projects[i].n; pill.style.background = projects[i].color;
      nameEl.textContent = projects[i].name; descEl.textContent = projects[i].desc;
    };
    const showCard = i => { title.style.opacity = 1; title.style.transform = `translate(-50%,-50%) rotate(${projects[i].rot}deg)`; };
    const hideCard = up => { title.style.opacity = 0; title.style.transform = `translate(-50%,-50%) translateY(${up?'-120vh':'70vh'}) rotate(${up?-14:10}deg)`; };
    const enterCTA = () => {
      title.dataset.cta = '1';
      inner.style.opacity = 0; inner.style.transform = 'translateY(18px)';
      clearTimeout(swapT);
      swapT = setTimeout(()=>{
        inner.style.display = 'none';
        cta.style.display = 'block';
        cta.style.transition = 'none'; cta.style.opacity = 0; cta.style.transform = 'translateY(-14px)';
        void cta.offsetWidth;
        cta.style.transition = 'opacity .3s ease, transform .4s cubic-bezier(.4,0,.6,1)';
        cta.style.opacity = 1; cta.style.transform = 'none';
      }, 220);
      title.style.opacity = 1;
      title.style.transform = 'translate(-50%,-50%) translateY(6vh) rotate(0deg)';
      title.style.pointerEvents = 'auto'; title.style.cursor = 'pointer';
      wrap.style.background = '#000';
    };
    const exitCTA = () => {
      title.dataset.cta = '';
      cta.style.display = 'none';
      inner.style.display = '';
      inner.style.opacity = 1; inner.style.transform = 'none';
      title.style.pointerEvents = 'none'; title.style.cursor = '';
      wrap.style.background = '';
    };
    let ticking = false;
    const update = () => {
      ticking = false;
      const vh = innerHeight;
      const mid = vh*0.5;
      let idx = wraps.findIndex(w=>{ const r = w.el.getBoundingClientRect(); return r.top <= mid && r.bottom > mid; });
      if(idx === -1 && outro.getBoundingClientRect().top <= mid) idx = 6;
      if(idx !== active){
        const wasCTA = active === 6;
        if(idx === 6){
          enterCTA();
        } else if(idx === -1){
          if(wasCTA) exitCTA();
          hideCard(wraps[0].el.getBoundingClientRect().top > mid);
        } else if(active === -1 || wasCTA){
          if(wasCTA) exitCTA();
          clearTimeout(swapT);
          setContent(idx);
          showCard(idx);
        } else {
          const i = idx;
          showCard(i);   // wobble to the new base tilt
          inner.style.opacity = 0; inner.style.transform = 'translateY(18px)';
          clearTimeout(swapT);
          swapT = setTimeout(()=>{
            setContent(i);
            inner.style.transition = 'none';
            inner.style.transform = 'translateY(-16px)';
            void inner.offsetWidth;
            inner.style.transition = 'opacity .28s ease, transform .34s cubic-bezier(.4,0,.6,1)';
            inner.style.opacity = 1; inner.style.transform = 'none';
          }, 180);
        }
        active = idx;
      }
      wraps.forEach(w=>{
        const r = w.el.getBoundingClientRect();
        if(r.bottom < -vh || r.top > vh*2) return;      // far offscreen, skip
        const span = r.height - vh;
        const p = Math.min(1.25, Math.max(-0.25, -r.top / span));
        const off = 0.5 - p;                             // +early → -late
        w.cards.forEach(c=>{
          const y = off * c.speed * vh * 1.6;
          const rot = c.base + off * c.drift;
          c.el.style.transform = `translate3d(0, ${y}px, 0) rotate(${rot}deg)`;
        });
      });
    };
    const onScroll = () => { if(!ticking){ ticking = true; requestAnimationFrame(update); setTimeout(update, 50); } };
    addEventListener('scroll', onScroll, {passive:true});
    addEventListener('resize', onScroll);
    update();
    this._cleanup = () => { removeEventListener('scroll', onScroll); removeEventListener('resize', onScroll); };
  }
  _eyes(){
    const title = this.titleRef.current; if(!title) return;
    const eyes = [...title.querySelectorAll('[data-eye]')];
    if(!eyes.length) return;
    let mx = innerWidth/2, my = innerHeight/2, raf = null;
    const tick = () => {
      raf = null;
      eyes.forEach(eye => {
        const p = eye.querySelector('[data-pupil]');
        const r = eye.getBoundingClientRect();
        if(!r.width) return;
        const cx = r.left + r.width/2, cy = r.top + r.height*0.34;
        const a = Math.atan2(my - cy, mx - cx);
        const d = Math.min(1, Math.hypot(mx - cx, my - cy) / (r.width * 2.6));
        const rx = r.width * 0.2 * d, ry = r.height * 0.13 * d;
        p.style.transform = 'translate(' + (Math.cos(a)*rx).toFixed(2) + 'px,' + (Math.sin(a)*ry).toFixed(2) + 'px)';
      });
    };
    const onMove = e => { mx = e.clientX; my = e.clientY; if(!raf) raf = requestAnimationFrame(tick); };
    addEventListener('mousemove', onMove, {passive:true});
    addEventListener('scroll', () => { if(!raf) raf = requestAnimationFrame(tick); }, {passive:true});
    tick();
    this._eyesOff = () => { removeEventListener('mousemove', onMove); if(raf) cancelAnimationFrame(raf); };
  }
  componentWillUnmount(){ if(this._cleanup) this._cleanup(); if(this._eyesOff) this._eyesOff(); }
  renderVals(){
    return { mainRef: this.mainRef, titleRef: this.titleRef, loaderRef: this.loaderRef, barRef: this.barRef, pctRef: this.pctRef };
  }
}
</script>
